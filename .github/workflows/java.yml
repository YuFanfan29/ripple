name: Java

on:
  pull_request:
    paths:
      - services/content/**
      - .github/workflows/java.yml
  push:
    branches: [main]
    paths:
      - services/content/**
      - .github/workflows/java.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Format check, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/content
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/content/pom.xml

      - name: Verify
        run: ./mvnw -B -ntp verify
